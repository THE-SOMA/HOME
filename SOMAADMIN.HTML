<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOMA STUDIO</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* 利用負邊距把頂部 28px 的 Google 橫幅推到螢幕外面 */
        iframe {
            width: 100vw;
            height: calc(100vh + 28px); 
            border: none;
            margin-top: -28px; 
        }
    </style>
</head>
<body>
    <!-- 將 src 替換成你的 GAS 應用程式發布網址 -->
    <iframe src="https://script.google.com/macros/s/AKfycbyMzpp6cdqtTHaqWSe66iC6jFDYUcQ8wrL-hnJ0r4ao35gs_-ZQKDNWR4r5boZGtIzVKw/exec?page=admin"></iframe>
</body>
</html>
